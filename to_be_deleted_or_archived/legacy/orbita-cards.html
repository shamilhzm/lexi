<!doctype html>
<html lang="en">

<title>Orbita — flip-card language learning</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070a14;
    --surface: rgba(20, 28, 50, 0.62);
    --surface-2: rgba(36, 48, 84, 0.6);
    --card: #121a30;
    --ink: #eef2fb;
    --ink-2: #aeb8d4;
    --ink-3: #76849f;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --accent: #5fd0a0;
    --accent-hover: #7adfb6;
    --accent-soft: rgba(95, 208, 160, 0.14);
    --know: #6fe0a8;
    --know-soft: rgba(95, 208, 160, 0.16);
    --again: #f0917f;
    --again-soft: rgba(240, 145, 127, 0.16);
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.6);
    --glow: 0 0 28px -4px rgba(95, 208, 160, 0.5);
    --radius: 18px;
    --radius-sm: 10px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #04060c;
    --surface: rgba(13, 19, 37, 0.7);
    --card: #0b1426;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background-color: #060912;
    background-image: radial-gradient(ellipse 115% 78% at 50% -10%, #1a2748 0%, #0b1124 46%, #060912 100%);
    background-attachment: fixed;
    line-height: 1.5;
    overscroll-behavior-y: none;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; background-repeat: no-repeat;
    background-image:
      radial-gradient(1.3px 1.3px at 14% 12%, #fff, transparent), radial-gradient(1px 1px at 72% 8%, #cfe0ff, transparent),
      radial-gradient(1.4px 1.4px at 28% 34%, #fff, transparent), radial-gradient(1px 1px at 58% 22%, #bcd0ff, transparent),
      radial-gradient(1.2px 1.2px at 86% 30%, #fff, transparent), radial-gradient(1px 1px at 8% 52%, #e6eeff, transparent),
      radial-gradient(1.3px 1.3px at 40% 60%, #fff, transparent), radial-gradient(1px 1px at 78% 56%, #cfe0ff, transparent),
      radial-gradient(1.2px 1.2px at 22% 78%, #fff, transparent), radial-gradient(1px 1px at 64% 86%, #bcd0ff, transparent),
      radial-gradient(1.4px 1.4px at 92% 72%, #fff, transparent), radial-gradient(1px 1px at 48% 94%, #fff, transparent);
  }
  h1, h2, h3, .serif { font-family: var(--serif); }
  button { font-family: inherit; cursor: pointer; }
  .app { max-width: 540px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px calc(8px + env(safe-area-inset-top, 0)); }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
  .brand .dot { color: var(--accent); }
  .streak-chip { font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; }

  /* Screens */
  .screen { flex: 1; padding: 6px 18px 110px; }

  .lede { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
  .h-greeting { font-size: 26px; margin: 6px 0 2px; }

  /* Due hero */
  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; text-align: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .hero .due-n { font-family: var(--serif); font-size: 54px; font-weight: 700; line-height: 1; color: var(--accent); text-shadow: 0 0 26px rgba(95,208,160,0.5); }
  .hero .due-label { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 13px 26px; font-size: 16px; font-weight: 700; box-shadow: var(--shadow); }

  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 600; }
  .btn-ghost:active { background: var(--surface-2); }

  /* Galaxy */
  .galaxy-wrap { background: transparent; border: 0; padding: 4px 0 0; margin-bottom: 22px; }
  .galaxy-wrap h3 { margin: 2px 4px 10px; font-size: 13px; color: var(--ink-2); font-weight: 700; }
  .galaxy svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 12px rgba(95,208,160,0.15)); }
  .galaxy-ring { fill: none; stroke: rgba(255,255,255,0.13); stroke-width: 1; stroke-dasharray: 2 6; }
  .ring-label { fill: var(--ink-3); font-size: 9px; font-weight: 700; font-family: var(--sans); }
  .dot { fill: rgba(255,255,255,0.42); }
  .dot.learning { fill: #ffc879; }
  .dot.mature { fill: var(--accent); }
  .galaxy-caption { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 6px; }

  /* Deck cards */
  .deck-grid { display: grid; gap: 12px; }
  .deck { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; width: 100%; color: var(--ink); }
  .deck:active { transform: translateY(1px); }
  .deck-emoji { font-size: 30px; width: 46px; height: 46px; display: grid; place-items: center; background: var(--surface-2); border-radius: 14px; flex-shrink: 0; }
  .deck-main { flex: 1; min-width: 0; }
  .deck-name { font-family: var(--serif); font-weight: 700; font-size: 17px; }
  .deck-desc { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck-meta { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .deck-due { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 9px; }
  .deck-due.zero { color: var(--ink-3); background: var(--surface-2); }
  .deck-count { font-size: 11px; color: var(--ink-3); }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 800; color: var(--ink-3); margin: 22px 2px 10px; }

  /* Forms */
  label.field { display: block; margin-bottom: 14px; }
  label.field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); display: block; margin-bottom: 5px; }
  input[type="text"], textarea, select { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 11px 13px; }
  textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .help { font-size: 12px; color: var(--ink-3); margin: 4px 2px 0; }
  .card-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-panel h2 { margin: 0 0 4px; font-size: 19px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Profile */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .stat .v { font-family: var(--serif); font-weight: 700; font-size: 26px; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .about { font-size: 13px; color: var(--ink-2); line-height: 1.6; }

  /* Bottom tab bar */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: space-around; background: rgba(8, 12, 24, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0)); max-width: 540px; margin: 0 auto; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; color: var(--ink-3); font-size: 11px; font-weight: 600; padding: 4px 14px; }
  .tab .ic { width: 24px; height: 24px; }
  .tab.active { color: var(--accent); }
  .tab.active .ic { filter: drop-shadow(0 0 7px rgba(95,208,160,0.55)); }

  /* Review overlay */
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }
  /* Review — galactic star-system (deep-space, scoped light-on-dark palette) */
  .review { position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% 16%, #1d2c50 0%, #0c1322 55%, #070a12 100%);
    --ink: #eef2fb; --ink-2: #b4bed8; --ink-3: #808db0; --surface: #18213b; --surface-2: #222d4d; --card: #161e36; --border: #2a3559; --border-strong: #3a4978; }
  .review.show { display: flex; }
  .review::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.75; background-repeat: no-repeat;
    background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 78% 12%, #cfe0ff, transparent), radial-gradient(1.4px 1.4px at 32% 60%, #fff, transparent), radial-gradient(1px 1px at 64% 80%, #bcd0ff, transparent), radial-gradient(1px 1px at 88% 50%, #fff, transparent), radial-gradient(1.2px 1.2px at 22% 88%, #e6eeff, transparent), radial-gradient(1px 1px at 47% 30%, #fff, transparent); }
  .review.know { background: radial-gradient(ellipse 120% 80% at 50% 16%, #15402b 0%, #081710 60%, #050b08 100%); }
  .review.again { background: radial-gradient(ellipse 120% 80% at 50% 16%, #4a1f1c 0%, #1a0a09 60%, #0c0605 100%); }
  .review-top { display: flex; align-items: center; gap: 14px; padding: calc(14px + env(safe-area-inset-top, 0)) 18px 6px; position: relative; z-index: 2; }
  .progress { flex: 1; height: 6px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, #6fd3a0, #4db98a); border-radius: 999px; transition: width 0.25s; box-shadow: 0 0 10px #4db98a; }
  .progress-n { font-size: 13px; font-weight: 700; color: var(--ink-2); min-width: 44px; text-align: right; }
  .swipe-hint { text-align: center; font-family: var(--serif); font-size: 21px; font-weight: 700; height: 26px; margin-top: 4px; opacity: 0; transition: opacity 0.12s; position: relative; z-index: 2; }
  .swipe-hint.know { color: #7ce0a8; opacity: 1; text-shadow: 0 0 16px rgba(124,224,168,0.6); }
  .swipe-hint.again { color: #f0917f; opacity: 1; text-shadow: 0 0 16px rgba(240,145,127,0.5); }

  .star-stage { flex: 1; display: grid; place-items: center; padding: 2px 18px; position: relative; z-index: 2; }
  .star-system { position: relative; width: min(84vw, 330px); aspect-ratio: 1; touch-action: pan-y; }
  .orbit-rings { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orbit-rings circle { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 1; stroke-dasharray: 2 6; }
  .orbit-field { position: absolute; inset: 0; animation: orbitspin 110s linear infinite; }
  @keyframes orbitspin { to { transform: rotate(360deg); } }
  @keyframes orbitspinrev { to { transform: rotate(-360deg); } }
  @keyframes starpulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.06); } }
  .star { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44%; aspect-ratio: 1; border: 0; border-radius: 50%; cursor: pointer; padding: 8px; color: #06231a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center;
    background: radial-gradient(circle at 38% 32%, #fff6d8 0%, #ffd47a 26%, #4db98a 78%, #2f8f6a 100%);
    box-shadow: 0 0 40px -2px rgba(110,211,160,0.7), 0 0 90px 10px rgba(110,211,160,0.22); }
  .star::after { content: ''; position: absolute; inset: -14%; border-radius: 50%; box-shadow: 0 0 50px 8px rgba(124,224,168,0.35); animation: starpulse 4.5s ease-in-out infinite; pointer-events: none; }
  .star-term { font-family: var(--serif); font-weight: 700; font-size: clamp(17px, 5.5vw, 25px); line-height: 1.1; }
  .star-term .art { opacity: 0.55; font-weight: 600; }
  .star-lvl { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; opacity: 0.7; }
  .planet { position: absolute; width: 48px; height: 48px; transform-origin: 50% 50%; animation: orbitspinrev 110s linear infinite; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; transition: opacity 0.4s; }
  .planet-orb { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08); }
  .planet-orb .ic { width: 18px; height: 18px; }
  .planet-label { font-size: 9px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
  .planet:active .planet-orb { transform: scale(0.92); }
  .star-system.recall .planet { opacity: 0.14; pointer-events: none; }
  .reveal-line { text-align: center; font-size: 13px; color: var(--ink-3); min-height: 22px; padding: 4px 16px; position: relative; z-index: 2; }
  .reveal-line.meaning { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--ink); }
  .planet-detail { margin: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; position: relative; z-index: 2; }
  .planet-detail.show { max-height: 230px; overflow-y: auto; }
  .pd-inner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-top: 4px; }
  .pd-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #7ce0a8; margin-bottom: 7px; }
  .pd-inner p { margin: 0; color: var(--ink); font-size: 14.5px; line-height: 1.5; }
  .pd-example { font-style: italic; color: var(--ink-2); }
  .pd-ipa { font-size: 19px; color: var(--ink); }
  .pd-play { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; }
  .pd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pd-chip { font-size: 13px; background: var(--surface-2); border-radius: 999px; padding: 3px 11px; color: var(--ink); }
  .pd-stats { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--ink-2); }
  .pd-stats b { color: var(--ink); }

  .review-bottom { padding: 8px 18px calc(16px + env(safe-area-inset-bottom, 0)); position: relative; z-index: 2; }
  .rate-row { display: flex; gap: 8px; margin-top: 6px; }
  .rate { flex: 1; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 14px; padding: 11px 4px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .rate small { display: block; font-size: 10px; font-weight: 600; color: var(--ink-3); margin-top: 2px; }
  .rate.again { border-color: #b85040; color: #f0917f; }
  .rate.good { border-color: #3f9e74; color: #7ce0a8; }
  .review-tools { display: flex; align-items: center; justify-content: center; gap: 26px; margin-bottom: 2px; }
  .tool { background: none; border: 0; color: var(--ink-2); padding: 6px; display: inline-flex; }
  .tool .ic { width: 22px; height: 22px; }
  .tool[disabled] { opacity: 0.3; }
  .done { text-align: center; padding: 40px 24px; position: relative; z-index: 2; }
  .done-star { color: #ffd47a; margin-bottom: 6px; }
  .done-star .ic { width: 46px; height: 46px; filter: drop-shadow(0 0 16px rgba(255,212,122,0.6)); }
  .done .big { font-family: var(--serif); font-size: 30px; font-weight: 700; margin-bottom: 8px; }
  .done .sub { color: var(--ink-2); margin-bottom: 22px; }
  @media (prefers-reduced-motion: reduce) { .orbit-field, .planet, .star::after { animation: none; } }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 999px; opacity: 0; transition: all 0.2s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty { text-align: center; color: var(--ink-3); padding: 40px 20px; font-size: 14px; }
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="brand">Orbita<span class="dot">.</span></div>
    <div class="streak-chip" id="streak-chip">🔥 0</div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-screen="practice"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/></svg>Practice</button>
  <button class="tab" data-screen="decks"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>Decks</button>

</nav>

<div class="review" id="review"></div>
<div class="toast" id="toast"></div>

<script>

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(defaultState);
    const p = JSON.parse(raw);
    const s = { ...structuredClone(defaultState), ...p };
    s.prefs = { ...defaultState.prefs, ...(p.prefs || {}) };
    s.stats = { ...defaultState.stats, ...(p.stats || {}) };
    if (!Array.isArray(s.decks)) s.decks = [];
    if (!Array.isArray(s.cards)) s.cards = [];
    s.cards.forEach(c => {
      if (!Array.isArray(c.synonyms)) c.synonyms = [];
      if (!Array.isArray(c.antonyms)) c.antonyms = [];
      if (!Array.isArray(c.collocations)) c.collocations = [];
      if (c.definition == null) c.definition = '';
    });
    return s;
  } catch (e) { return structuredClone(defaultState); }
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {} }

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function uid(p) { return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function escapeHtml(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// ---- SRS (SM-2, ported from the personal Orbita; FSRS-ready history) --------
function newCard(f) {
  return {
    id: f.id || uid('c'), deckId: f.deckId, lang: f.lang || 'de',
    front: f.front, back: f.back, example: f.example || '', ipa: f.ipa || '', pos: f.pos || '', level: f.level || '',
    definition: f.definition || '', synonyms: f.synonyms || [], antonyms: f.antonyms || [], collocations: f.collocations || [],
    enriched: false, enrichedAt: null,
    created: Date.now(), lastReviewed: null, due: Date.now(),
    interval: 0, ease: 2.5, reps: 0, lapses: 0, status: 'new', history: []
  };
}
function srsRate(card, rating) {
  const q = rating + 2;
  const prevInterval = card.interval, prevEase = card.ease;
  if (rating === RATING.AGAIN) { card.lapses += 1; card.reps = 0; card.interval = 0; card.status = 'learning'; }
  else {
    card.reps += 1;
    if (card.reps === 1) card.interval = 1;
    else if (card.reps === 2) card.interval = rating === RATING.HARD ? 3 : 6;
    else { const mult = rating === RATING.HARD ? 1.2 : rating === RATING.EASY ? card.ease * 1.3 : card.ease; card.interval = Math.round(card.interval * mult); }
    card.status = 'review';
  }
  card.ease = Math.max(1.3, card.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  card.lastReviewed = Date.now();
  card.due = Date.now() + Math.max(0, card.interval) * SRS_DAY;
  card.history.push({ ts: Date.now(), rating, q, prevInterval, newInterval: card.interval, prevEase, newEase: card.ease, reps: card.reps, lapses: card.lapses });
  return card;
}
// Due cards, interleaved round-robin across decks (new first within a deck).
function cardsDue(now, deckId) {
  now = now || Date.now();
  const due = STATE.cards.filter(c => c.due <= now && (!deckId || c.deckId === deckId));
  const byDeck = {};
  due.forEach(c => (byDeck[c.deckId] || (byDeck[c.deckId] = [])).push(c));
  Object.values(byDeck).forEach(arr => arr.sort((a, b) =>
    (a.status === 'new' ? 0 : 1) - (b.status === 'new' ? 0 : 1) || a.due - b.due));
  const order = Object.keys(byDeck);
  const merged = [];
  let any = true;
  while (any) { any = false; for (const d of order) { if (byDeck[d].length) { merged.push(byDeck[d].shift()); any = true; } } }
  return merged;
}
function dueCount(deckId) { return cardsDue(Date.now(), deckId).length; }
function deckStats() { return { decks: STATE.decks.length, cards: STATE.cards.length, due: dueCount() }; }

function recordReview() {
  const today = todayStr();
  if (STATE.stats.lastReviewDay !== today) {
    if (STATE.stats.lastReviewDay) {
      const y = new Date(); y.setDate(y.getDate() - 1);
      const yStr = y.toISOString().slice(0, 10);
      STATE.stats.streak = STATE.stats.lastReviewDay === yStr ? STATE.stats.streak + 1 : 1;
    } else STATE.stats.streak = 1;
    STATE.stats.reviewedToday = 0;
    STATE.stats.lastReviewDay = today;
  }
  STATE.stats.reviewedToday += 1;
  STATE.stats.totalReviews += 1;
}

// ---- Free enrichment (no API key): German Wiktionary + MyMemory -----------
const WIKTIONARY_API = 'https://de.wiktionary.org/w/api.php';
const MYMEMORY_API = 'https://api.mymemory.translated.net/get';

// Strip German-Wiktionary wikitext markup to plain text. Pure — unit-tested.
function cleanWikiMarkup(s) {
  return String(s || '')
    .replace(/\{\{[^{}]*\}\}/g, '')
    .replace(/\[\[([^\]|]*\|)?([^\]]*)\]\]/g, '$2')
    .replace(/'''?/g, '')
    .replace(/\[\d+[a-z]?\]/g, '')
    .replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi, '')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
// Items from a German-Wiktionary {{Section}} block.
function wikiSection(wikitext, template) {
  const re = new RegExp('\\{\\{' + template + '\\}\\}([\\s\\S]*?)(?=\\n\\{\\{[A-Za-zÄÖÜ]|\\n==|$)');
  const m = String(wikitext || '').match(re);
  if (!m) return [];
  return m[1].split('\n')
    .map(l => l.replace(/^:?\s*(\[[\d.,\s–-]*\])?\s*/, '').trim())
    .map(cleanWikiMarkup)
    .filter(s => s && s.length > 1);
}
// Parse the fields we want out of German-Wiktionary wikitext. Pure — unit-tested.
function parseWiktionary(wikitext) {
  const wt = String(wikitext || '');
  const ipaM = wt.match(/\{\{Lautschrift\|([^}|]+)\}\}/);
  return {
    ipa: ipaM ? ipaM[1].trim() : '',
    definitions: wikiSection(wt, 'Bedeutungen'),
    synonyms: wikiSection(wt, 'Synonyme'),
    antonyms: wikiSection(wt, 'Gegenwörter'),
    collocations: wikiSection(wt, 'Charakteristische Wortkombinationen'),
    examples: wikiSection(wt, 'Beispiele')
  };
}
function enrichTerm(front) { return String(front || '').replace(/^(der|die|das)\s+/i, '').trim(); }
async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

// Enrich one card from free sources. Caches onto the card; never touches SRS fields.
async function enrichCard(card) {
  if (!card || card.enriched || card._enriching) return card;
  card._enriching = true;
  const term = enrichTerm(card.front);
  try {
    try {
      const data = await fetchJson(`${WIKTIONARY_API}?action=parse&page=${encodeURIComponent(term)}&prop=wikitext&format=json&origin=*`);
      const wt = data && data.parse && data.parse.wikitext && data.parse.wikitext['*'];
      if (wt) {
        const p = parseWiktionary(wt);
        if (p.ipa && !card.ipa) card.ipa = p.ipa;
        if (p.definitions.length && !card.definition) card.definition = p.definitions[0];
        if (p.synonyms.length) card.synonyms = p.synonyms.slice(0, 6);
        if (p.antonyms.length) card.antonyms = p.antonyms.slice(0, 6);
        if (p.collocations.length) card.collocations = p.collocations.slice(0, 6);
        if (p.examples.length && !card.example) card.example = p.examples[0];
      }
    } catch (e) {}
    if (!card.back) {
      try {
        const tr = await fetchJson(`${MYMEMORY_API}?q=${encodeURIComponent(term)}&langpair=de|en`);
        const t = tr && tr.responseData && tr.responseData.translatedText;
        if (t && !/MYMEMORY WARNING|QUERY LENGTH|INVALID/i.test(t)) card.back = t;
      } catch (e) {}
    }
    card.enriched = true;
    card.enrichedAt = Date.now();
  } catch (e) {}
  delete card._enriching;
  saveState();
  return card;
}

// ---- Galaxy layout (ported) ------------------------------------------------
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function cefrIndexOf(card) {
  const map = { A1: 0, A2: 1, B1: 2, B2: 3, C1: 4, C2: 5 };
  const ex = (card.level || '').toUpperCase().slice(0, 2);
  if (map[ex] != null) return map[ex];
  let t = (card.front || '').replace(/^(der|die|das)\s+/i, '').trim();
  const len = t.length;
  let b;
  if (len <= 4) b = 0; else if (len <= 6) b = 1; else if (len <= 9) b = 2; else if (len <= 12) b = 3; else if (len <= 16) b = 4; else b = 5;
  if (t.includes(' ') || t.includes('-')) b = Math.min(5, b + 1);
  return b;
}

// ---- Seeding ---------------------------------------------------------------
function seedDecks() {
  STATE.prefs.seeded = STATE.prefs.seeded || [];
  if (STATE.prefs.seeded.includes(SEED_FLAG)) return 0;
  let added = 0;
  for (const d of SEED_DECKS) {
    if (!STATE.decks.some(x => x.id === d.id)) STATE.decks.push({ id: d.id, name: d.name, emoji: d.emoji, desc: d.desc, lang: d.lang, builtin: true });
    for (const c of d.cards) {
      const id = d.id + ':' + c.front.toLowerCase().trim();
      if (STATE.cards.some(x => x.id === id)) continue;
      STATE.cards.push(newCard({ id, deckId: d.id, lang: d.lang, front: c.front, back: c.back, example: c.example, pos: c.pos, level: c.level }));
      added++;
    }
  }
  STATE.prefs.seeded.push(SEED_FLAG);
  saveState();
  return added;
}

// ---- Bring-your-own-content ------------------------------------------------
// Parse pasted lines into {front, back}. Accepts tab, " — ", " – ", " - ", "=".
function parsePaste(text) {
  const out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const l = line.trim();
    if (!l) return;
    const m = l.split(/\t| [—–-] |=/);
    if (m.length >= 2) {
      const front = m[0].trim();
      const back = m.slice(1).join(' ').trim();
      if (front && back) out.push({ front, back });
    }
  });
  return out;
}
function addCard(deckId, front, back, example) {
  front = (front || '').trim(); back = (back || '').trim();
  if (!front || !back) return null;
  const deck = STATE.decks.find(d => d.id === deckId);
  const card = newCard({ deckId, lang: deck ? deck.lang : 'de', front, back, example: (example || '').trim() });
  STATE.cards.push(card);
  return card;
}
function createDeck(name, lang) {
  const id = uid('d');
  STATE.decks.push({ id, name: (name || 'New deck').trim(), lang: lang || 'de', desc: '', emoji: '🗂️', builtin: false });
  return id;
}

// ---- Export / import -------------------------------------------------------
function exportJSON() { return JSON.stringify({ v: STATE.v, decks: STATE.decks, cards: STATE.cards, stats: STATE.stats }, null, 2); }
function importJSON(text) {
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.cards) || !Array.isArray(data.decks)) throw new Error('Not a Orbita export');
  const deckIds = new Set(STATE.decks.map(d => d.id));
  data.decks.forEach(d => { if (!deckIds.has(d.id)) { STATE.decks.push(d); deckIds.add(d.id); } });
  const byId = new Map(STATE.cards.map(c => [c.id, c]));
  data.cards.forEach(c => {
    const ex = byId.get(c.id);
    if (!ex) { STATE.cards.push(c); byId.set(c.id, c); }
    else if ((c.history || []).length > (ex.history || []).length) Object.assign(ex, c); // newer history wins
  });
  saveState();
  return { decks: STATE.decks.length, cards: STATE.cards.length };
}

  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}
function applyTheme() {
  const t = STATE.prefs.theme;
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function speak(text, lang) {
  try {
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(String(text).replace(/^(der|die|das)\s+/i, ''));
    u.lang = (lang === 'de' || !lang) ? 'de-DE' : lang;
    u.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function updateStreakChip() { document.getElementById('streak-chip').textContent = '🔥 ' + (STATE.stats.streak || 0); }

let screen = 'practice';
function showScreen(name) {
  screen = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.screen === name));
  render();
}
function render() {
  updateStreakChip();
  const el = document.getElementById('screen');
  if (screen === 'practice') el.innerHTML = viewPractice();
  else if (screen === 'decks') el.innerHTML = viewDecks();
  else if (screen === 'add') el.innerHTML = viewAdd();
  else if (screen === 'profile') el.innerHTML = viewProfile();
  bindScreen();
}

function greeting() { const h = new Date().getHours(); return h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend'; }

function viewPractice() {
  const due = dueCount();
  const total = STATE.cards.length;
  return `
    <h1 class="h-greeting serif">${greeting()}.</h1>
    <p class="lede">${total} cards across ${STATE.decks.length} decks · bring your own, or start with these.</p>
    <div class="hero">
      <div class="due-n">${due}</div>
      <div class="due-label">${due === 1 ? 'card' : 'cards'} fällig heute</div>
      <button class="btn-primary full" id="start-all" ${due ? '' : 'disabled'}>${due ? 'Start review →' : 'Nichts fällig — alles erledigt ✦'}</button>
    </div>
    ${galaxySvg()}
    <div class="section-label">Jump into a deck</div>
    <div class="deck-grid">${STATE.decks.map(deckRow).join('') || '<div class="empty">No decks yet. Add some on the Add tab.</div>'}</div>
  `;
}
function galaxySvg() {
  const cards = STATE.cards;
  const W = 320, H = 320, cx = W / 2, cy = H / 2;
  const levels = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  const rMin = 20, rMax = 148, step = (rMax - rMin) / (levels.length - 1);
  const ringR = i => rMin + i * step;
  let rings = '';
  levels.forEach((lv, i) => { rings += `<circle class="galaxy-ring" cx="${cx}" cy="${cy}" r="${ringR(i)}"/><text class="ring-label" x="${cx}" y="${cy - ringR(i) + 11}" text-anchor="middle">${lv}</text>`; });
  let dots = '';
  cards.forEach(c => {
    const li = cefrIndexOf(c);
    const h = hashStr(c.front || c.id);
    const ang = (h % 360) * Math.PI / 180;
    const band = step * 0.32;
    const rr = ringR(li) + (((h >> 9) % 100) / 100 - 0.5) * band;
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    let cls = 'dot';
    if (c.status === 'review' && (c.interval || 0) >= 21) cls += ' mature';
    else if ((c.reps || 0) > 0 || c.status === 'learning') cls += ' learning';
    dots += `<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3"/>`;
  });
  return `<div class="galaxy-wrap"><h3>Your galaxy — ${cards.length} words by level</h3><div class="galaxy"><svg viewBox="0 0 ${W} ${H}">${rings}${dots}</svg></div><div class="galaxy-caption">A1 at the core · C2 on the rim · green = mature, amber = learning · tap a star to open it</div></div>`;
}
function deckRow(d) {
  const total = STATE.cards.filter(c => c.deckId === d.id).length;
  const due = dueCount(d.id);
  return `<button class="deck" data-deck="${escapeHtml(d.id)}">
    <div class="deck-emoji">${d.emoji || '🗂️'}</div>
    <div class="deck-main"><div class="deck-name">${escapeHtml(d.name)}</div><div class="deck-desc">${escapeHtml(d.desc || (total + ' cards'))}</div></div>
    <div class="deck-meta"><span class="deck-due ${due ? '' : 'zero'}">${due} due</span><span class="deck-count">${total}</span></div>
  </button>`;
}

function viewDecks() {
  return `
    <h1 class="h-greeting serif">Decks</h1>
    <p class="lede">Tap a deck to review just those cards.</p>
    <div class="deck-grid">${STATE.decks.map(deckRow).join('') || '<div class="empty">No decks yet.</div>'}</div>
  `;
}

function viewAdd() {
  const opts = STATE.decks.map(d => `<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join('');
  return `
    <h1 class="h-greeting serif">Add cards</h1>
    <p class="lede">Bring your own content — the heart of Orbita.</p>
    <div class="card-panel">
      <h2>Paste a list</h2>

        <select id="paste-deck">${opts}<option value="__new">+ New deck…</option></select></label>
      <textarea id="paste-text" placeholder="die Sonne — the sun&#10;der Mond — the moon&#10;in Betracht ziehen — to take into account"></textarea>

      <h2>Add one card</h2>

        <select id="one-deck">${opts}<option value="__new">+ New deck…</option></select></label>
      <label class="field"><span class="lbl">Front (term / concept)</span><input type="text" id="one-front" placeholder="der Vermögenswert"></label>
      <label class="field"><span class="lbl">Back (meaning)</span><input type="text" id="one-back" placeholder="asset"></label>
      <label class="field"><span class="lbl">Example (optional)</span><input type="text" id="one-example" placeholder="Immobilien sind ein beliebter Vermögenswert."></label>
      <button class="btn-primary full" id="one-go">Add card</button>

}

function viewProfile() {
  const s = STATE.stats;
  const dark = STATE.prefs.theme === 'dark';
  return `
    <h1 class="h-greeting serif">Profile</h1>
    <div class="stat-grid">
      <div class="stat"><div class="v">${s.streak || 0}</div><div class="k">Streak</div></div>
      <div class="stat"><div class="v">${s.reviewedToday || 0}</div><div class="k">Today</div></div>
      <div class="stat"><div class="v">${s.totalReviews || 0}</div><div class="k">Total</div></div>
    </div>
    <div class="card-panel">
      <div class="toggle-row"><span>Dark theme</span><button class="btn-ghost" id="toggle-theme">${dark ? 'On' : 'Off'}</button></div>
      <div class="toggle-row"><span>Export deck (JSON)</span><button class="btn-ghost" id="do-export">Export</button></div>
      <div class="toggle-row" style="border-bottom:0;"><span>Import deck (JSON)</span><button class="btn-ghost" id="do-import">Import</button></div>
    </div>
    <div class="card-panel">
      <h2>About</h2>
      <p class="about"><b>Orbita</b> is an open-source, bring-your-own-content flashcard app for any language. Paste your own words and concepts — or any text you actually want to read — and review them with spaced repetition. Inspired by Karteto and Duolingo, built to be yours.</p>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" style="display:none">
  `;
}

function bindScreen() {
  const el = document.getElementById('screen');
  const start = el.querySelector('#start-all');
  if (start) start.onclick = () => startReview(null);
  el.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => {
    const id = b.dataset.deck;
    if (dueCount(id) > 0) startReview(id);
    else { toast('Nichts fällig in diesem Deck'); }
  });
  const pasteGo = el.querySelector('#paste-go');
  if (pasteGo) pasteGo.onclick = doPasteImport;
  const oneGo = el.querySelector('#one-go');
  if (oneGo) oneGo.onclick = doAddOne;
  const tt = el.querySelector('#toggle-theme');
  if (tt) tt.onclick = () => { STATE.prefs.theme = STATE.prefs.theme === 'dark' ? null : 'dark'; applyTheme(); saveState(); render(); };
  const ex = el.querySelector('#do-export');
  if (ex) ex.onclick = doExport;
  const im = el.querySelector('#do-import');
  if (im) im.onclick = () => el.querySelector('#import-file').click();
  const file = el.querySelector('#import-file');
  if (file) file.onchange = doImportFile;
}

function resolveDeckSelect(selId) {
  const sel = document.getElementById(selId);
  let deckId = sel.value;
  if (deckId === '__new') {
    const name = prompt('New deck name:');
    if (!name) return null;
    deckId = createDeck(name, 'de');
  }
  return deckId;
}
function doPasteImport() {
  const deckId = resolveDeckSelect('paste-deck');
  if (!deckId) return;
  const rows = parsePaste(document.getElementById('paste-text').value);
  if (!rows.length) { toast('No "front — back" lines found'); return; }
  rows.forEach(r => addCard(deckId, r.front, r.back));
  saveState();
  toast(rows.length + ' card' + (rows.length === 1 ? '' : 's') + ' added');
  showScreen('decks');
}
function doAddOne() {
  const deckId = resolveDeckSelect('one-deck');
  if (!deckId) return;
  const c = addCard(deckId, document.getElementById('one-front').value, document.getElementById('one-back').value, document.getElementById('one-example').value);
  if (!c) { toast('Need a front and a back'); return; }
  saveState();
  toast('Card added');
  render();
}
function doExport() {
  try {
    const blob = new Blob([exportJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'verse-deck-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Exported');
  } catch (e) { toast('Export failed'); }
}
function doImportFile(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const res = importJSON(r.result); toast('Imported · ' + res.cards + ' cards'); render(); } catch (err) { toast('Import failed: ' + err.message); } };
  r.readAsText(f);
}

// ===========================================================================
// Review engine (flip + swipe)
// ===========================================================================
let queue = [], qi = 0, lastRated = null, revealed = false;
function startReview(deckId) {
  queue = cardsDue(Date.now(), deckId);
  if (!queue.length) { toast('Nichts fällig'); return; }
  qi = 0; flipped = false; lastRated = null;
  document.getElementById('review').classList.add('show');
  renderCard();
}
function closeReview() {
  document.getElementById('review').classList.remove('show', 'know', 'again');
  render();
}
function renderCard() {
  const rv = document.getElementById('review');
  rv.classList.remove('know', 'again');
  if (qi >= queue.length) { renderDone(); return; }
  const c = queue[qi];
  if (!c.enriched) enrichCard(c).then(() => { if (queue[qi] === c && document.getElementById('starsys')) renderCard(); });
  const planets = starPlanets(c);
  rv.innerHTML = `
    <div class="review-top">
      <button class="tool" id="rv-close" title="Close">${icon('close')}</button>
      <div class="progress"><i style="width:${Math.round(qi / queue.length * 100)}%"></i></div>
      <div class="progress-n">${qi + 1}/${queue.length}</div>
    </div>
    <div class="swipe-hint" id="swipe-hint"></div>
    <div class="star-stage">
      <div class="star-system recall${c.enriched ? '' : ' loading'}" id="starsys">
        <svg class="orbit-rings" viewBox="0 0 300 300"><circle cx="150" cy="150" r="122"/><circle cx="150" cy="150" r="86"/></svg>
        <div class="orbit-field" id="orbit-field">${planets.map(planetHtml).join('')}</div>
        <button class="star" id="star">
          <span class="star-term">${termHtml(c.front)}</span>
          ${c.level ? `<span class="star-lvl">${escapeHtml(c.level)}</span>` : ''}
        </button>
      </div>
    </div>
    <div class="reveal-line" id="reveal-line">${c.enriched ? 'tap the star to reveal · swipe to rate' : 'gathering the system…'}</div>
    <div class="planet-detail" id="planet-detail"></div>
    <div class="review-bottom">
      <div class="review-tools">
        <button class="tool" id="rv-undo" ${lastRated ? '' : 'disabled'} title="Undo">${icon('undo')}</button>
        <button class="tool" id="rv-audio" title="Audio">${icon('sound')}</button>
      </div>
      <div class="rate-row">
        <button class="rate again" data-rate="0">Again<small>&lt;1 min</small></button>
        <button class="rate" data-rate="1">Hard</button>
        <button class="rate good" data-rate="2">Good</button>
        <button class="rate" data-rate="3">Easy</button>
      </div>
    </div>`;
  revealed = false;
  positionPlanets();
  bindCard(c);
}
function termHtml(front) {
  const m = String(front).match(/^(der|die|das)\s+(.+)$/i);
  if (m) return `<span class="art">${escapeHtml(m[1])}</span> ${escapeHtml(m[2])}`;
  return escapeHtml(front);
}
function chipList(arr) { return `<div class="pd-chips">${arr.map(s => `<span class="pd-chip">${escapeHtml(s)}</span>`).join('')}</div>`; }
function cardStatsHtml(c) {
  const total = (c.history || []).length;
  const good = (c.history || []).filter(h => h.rating >= 2).length;
  const acc = total ? Math.round(good / total * 100) + '%' : '—';
  const next = !c.reps ? 'new' : (c.interval >= 1 ? 'in ' + c.interval + ' d' : '<1 d');
  return `<div class="pd-stats"><span><b>${c.reps || 0}</b> reps</span><span><b>${acc}</b> recall</span><span><b>${next}</b> next</span><span><b>${(c.ease || 2.5).toFixed(2)}</b> ease</span></div>`;
}
function starPlanets(c) {
  return [
    { key: 'sound', icon: 'sound', label: 'Aussprache', title: 'Aussprache', content: `<div class="pd-ipa">${escapeHtml(c.ipa || '—')}</div><button class="btn-ghost pd-play" id="pd-play">${icon('sound')} Anhören</button>` },
    c.definition && { key: 'def', icon: 'book', label: 'Definition', title: 'Definition', content: `<p>${escapeHtml(c.definition)}</p>` },
    c.example && { key: 'ex', icon: 'quote', label: 'Beispiel', title: 'Beispiel', content: `<p class="pd-example">${escapeHtml(c.example)}</p>` },
    (c.synonyms && c.synonyms.length) && { key: 'syn', icon: 'syn', label: 'Synonyme', title: 'Synonyme', content: chipList(c.synonyms) },
    (c.antonyms && c.antonyms.length) && { key: 'ant', icon: 'ant', label: 'Gegenteil', title: 'Gegenwörter', content: chipList(c.antonyms) },
    (c.collocations && c.collocations.length) && { key: 'col', icon: 'link', label: 'Kombis', title: 'Wortkombinationen', content: chipList(c.collocations) },
    { key: 'stats', icon: 'chart', label: 'Statistik', title: 'Lernstatistik', content: cardStatsHtml(c) }
  ].filter(Boolean);
}
function planetHtml(p) {
  return `<button class="planet" data-planet="${p.key}" aria-label="${escapeHtml(p.label)}"><span class="planet-orb">${icon(p.icon)}</span><span class="planet-label">${escapeHtml(p.label)}</span></button>`;
}
function positionPlanets() {
  const field = document.getElementById('orbit-field');
  if (!field) return;
  const els = field.querySelectorAll('.planet');
  const N = els.length;
  els.forEach((el, i) => {
    const ang = (-90 + i * (360 / N)) * Math.PI / 180;
    const R = (i % 2 === 0) ? 40 : 30; // alternate two orbit radii (% of half-size)
    el.style.left = `calc(${(50 + Math.cos(ang) * R).toFixed(2)}% - 24px)`;
    el.style.top = `calc(${(50 + Math.sin(ang) * R).toFixed(2)}% - 24px)`;
  });
}
function revealStar(c) {
  if (revealed) return;
  revealed = true;
  const sys = document.getElementById('starsys');
  if (sys) sys.classList.remove('recall');
  const rl = document.getElementById('reveal-line');
  if (rl) { rl.textContent = c.back || '—'; rl.className = 'reveal-line meaning'; }
}
function openPlanet(c, key) {
  const p = starPlanets(c).find(x => x.key === key);
  const pd = document.getElementById('planet-detail');
  if (!p || !pd) return;
  pd.innerHTML = `<div class="pd-inner"><div class="pd-title">${escapeHtml(p.title)}</div>${p.content}</div>`;
  pd.classList.add('show');
  const play = document.getElementById('pd-play');
  if (play) play.onclick = (e) => { e.stopPropagation(); speak(c.front, c.lang); };
}
function bindCard(c) {
  const sys = document.getElementById('starsys');
  const star = document.getElementById('star');
  const rv = document.getElementById('review');
  const hint = document.getElementById('swipe-hint');
  document.getElementById('rv-close').onclick = closeReview;
  document.getElementById('rv-audio').onclick = (e) => { e.stopPropagation(); speak(c.front, c.lang); };
  document.getElementById('rv-undo').onclick = (e) => { e.stopPropagation(); undoLast(); };
  document.querySelectorAll('.rate').forEach(b => b.onclick = (e) => { e.stopPropagation(); rate(parseInt(b.dataset.rate)); });
  star.addEventListener('click', () => { if (!sys._dragged) { if (!revealed) revealStar(c); else speak(c.front, c.lang); } });
  document.querySelectorAll('.planet').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (sys._dragged) return;
    if (!revealed) revealStar(c);
    openPlanet(c, b.dataset.planet);
  }));
  let startX = 0, startY = 0, dx = 0, dragging = false;
  sys.addEventListener('pointerdown', (e) => { dragging = true; startX = e.clientX; startY = e.clientY; dx = 0; sys._dragged = false; sys.style.transition = 'none'; try { sys.setPointerCapture(e.pointerId); } catch (_) {} });
  sys.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX; const dy = e.clientY - startY;
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    sys._dragged = true;
    sys.style.transform = `translateX(${dx}px) rotate(${(dx / 22).toFixed(2)}deg)`;
    if (dx > 44) { hint.textContent = 'I know it'; hint.className = 'swipe-hint know'; rv.classList.add('know'); rv.classList.remove('again'); }
    else if (dx < -44) { hint.textContent = 'Learn again'; hint.className = 'swipe-hint again'; rv.classList.add('again'); rv.classList.remove('know'); }
    else { hint.className = 'swipe-hint'; rv.classList.remove('know', 'again'); }
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; sys.style.transition = '';
    if (dx > 120) flingAndRate(2, 1);
    else if (dx < -120) flingAndRate(0, -1);
    else { sys.style.transform = ''; hint.className = 'swipe-hint'; rv.classList.remove('know', 'again'); }
    setTimeout(() => { sys._dragged = false; }, 40);
  };
  sys.addEventListener('pointerup', end);
  sys.addEventListener('pointercancel', end);
}
function flingAndRate(rating, dir) {
  const sys = document.getElementById('starsys');
  if (sys) { sys.style.transition = 'transform 0.3s ease-out, opacity 0.3s'; sys.style.transform = `translateX(${dir * 640}px) rotate(${dir * 26}deg)`; sys.style.opacity = '0'; }
  setTimeout(() => rate(rating), 200);
}
function rate(rating) {
  const c = queue[qi];
  if (!c) return;
  lastRated = { id: c.id, snapshot: JSON.parse(JSON.stringify(c)), wasReviewedToday: STATE.stats.reviewedToday, streak: STATE.stats.streak, lastReviewDay: STATE.stats.lastReviewDay };
  srsRate(c, rating);
  recordReview();
  saveState();
  qi += 1;
  renderCard();
}
function undoLast() {
  if (!lastRated) return;
  const c = STATE.cards.find(x => x.id === lastRated.id);
  if (c) Object.assign(c, lastRated.snapshot);
  STATE.stats.reviewedToday = lastRated.wasReviewedToday;
  STATE.stats.streak = lastRated.streak;
  STATE.stats.lastReviewDay = lastRated.lastReviewDay;
  STATE.stats.totalReviews = Math.max(0, STATE.stats.totalReviews - 1);
  saveState();
  qi = Math.max(0, qi - 1);
  lastRated = null;
  renderCard();
}
function renderDone() {
  const rv = document.getElementById('review');
  rv.classList.remove('know', 'again');
  rv.innerHTML = `<div class="review-top"><button class="tool" id="rv-close" title="Close">${icon('close')}</button><div class="progress"><i style="width:100%"></i></div><div class="progress-n">${queue.length}/${queue.length}</div></div>
    <div class="done">
      <div class="done-star">${icon('star')}</div>
      <div class="big">Geschafft!</div>
      <div class="sub">${queue.length} cards reviewed · ${STATE.stats.streak}-day streak</div>
      <button class="btn-primary" id="rv-back">Back to Practice</button>
    </div>`;
  document.getElementById('rv-close').onclick = closeReview;
  document.getElementById('rv-back').onclick = closeReview;
}

// ---- keyboard ---------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('review').classList.contains('show')) return;
  if (qi >= queue.length) return;
  if (e.code === 'Space') { e.preventDefault(); const c = queue[qi]; if (c) revealStar(c); }
  else if (e.key >= '1' && e.key <= '4') { rate(parseInt(e.key) - 1); }
  else if (e.key === 'Escape') closeReview();
});

// ---- boot -------------------------------------------------------------------
document.getElementById('tabbar').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (t) showScreen(t.dataset.screen);
});
seedDecks();
seedFreqDecks();
applyTheme();
render();
</script>
